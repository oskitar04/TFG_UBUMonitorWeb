; PHP personalizado para el Moodle Local con los valores para ampliar.
; Montado en /opt/bitnami/php/etc/conf.d/custom.ini, así se carga el último y sobreescribe a php.ini
; Para poder restaurar cursos grandes

max_execution_time = 300
max_input_time = 300
memory_limit = 1024M
post_max_size = 2000M
upload_max_filesize = 2000M
