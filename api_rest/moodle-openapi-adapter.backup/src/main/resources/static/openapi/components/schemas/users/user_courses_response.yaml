UserCoursesResponse:
  type: object
  properties:
    courses:
      type: array
      items:
        title: UserCourse
        type: object
        properties:
          id:
            type: integer
            description: id of course
          shortname:
            type: string
            description: short name of course
          fullname:
            type: string
            description: long name of course
          displayname:
            type: string
            description: course display name for lists
            nullable: true
          enrolledusercount:
            type: integer
            description: Number of enrolled users in this course
            nullable: true
          idnumber:
            type: string
            description: id number of course
          visible:
            type: integer
            description: 1 means visible, 0 means not yet visible course
          summary:
            type: string
            description: summary
            nullable: true
          summarytext:
            type: string
            description: summary text without formatting
            nullable: true
          summaryformat:
            type: string
            enum:
              - MOODLE
              - HTML
              - PLAIN
              - MARKDOWN
            description: summary format
            nullable: true
          format:
            type: string
            enum:
              - WEEKS
              - TOPICS
              - SOCIAL
              - SITE
              - SINGLE_ACTIVITY
            description: "course format: WEEKS, TOPICS, SOCIAL, SITE"
            nullable: true
          courseimage:
            type: string
            format: uri
            description: The course image URL
            nullable: true
          downloadlogurl:
            type: string
            format: uri
            description: The course download course log URL
          showgrades:
            type: boolean
            description: true if grades are shown, otherwise false
            nullable: true
          lang:
            type: string
            description: forced course language
            nullable: true
          enablecompletion:
            type: boolean
            description: true if completion is enabled, otherwise false
            nullable: true
          completionhascriteria:
            type: boolean
            description: If completion criteria is set
            nullable: true
          completionusertracked:
            type: boolean
            description: If the user is completion tracked
            nullable: true
          category:
            type: integer
            description: course category id
            nullable: true
          progress:
            type: number
            description: Progress percentage
            nullable: true
          completed:
            type: boolean
            description: Whether the course is completed
            nullable: true
          startdate:
            type: string
            format: date-time
            description: Timestamp when the course start
            nullable: true
          enddate:
            type: string
            format: date-time
            description: Timestamp when the course end
            nullable: true
          marker:
            type: integer
            description: Course section marker
            nullable: true
          lastaccess:
            type: string
            format: date-time
            description: Last access to the course (ISO date time)
            nullable: true
          isfavourite:
            type: boolean
            description: If the user marked this course a favourite
            nullable: true
          hidden:
            type: boolean
            description: If the user hide the course from the dashboard
            nullable: true
          overviewfiles:
            type: array
            description: Overview files attached to this course
            nullable: true
            items:
              title: Overview File
              type: object
              properties:
                filename:
                  type: string
                  nullable: true
                filepath:
                  type: string
                  nullable: true
                filesize:
                  type: integer
                  nullable: true
                fileurl:
                  type: string
                  format: uri
                  nullable: true
                timemodified:
                  type: string
                  format: date-time
                  nullable: true
                mimetype:
                  type: string
                  nullable: true
                isexternalfile:
                  type: integer
                  nullable: true
                repositorytype:
                  type: string
                  nullable: true
                icon:
                  type: string
                  nullable: true
              required: [ ]
          showactivitydates:
            type: boolean
            description: Whether the activity dates are shown or not
          showcompletionconditions:
            type: boolean
            description: Whether the activity completion conditions are shown or not
          timemodified:
            type: string
            format: date-time
            description: Last time course settings were updated (timestamp)
            nullable: true
          required:
            - id
            - shortname
            - fullname
            - idnumber
            - visible
            - showactivitydates
            - showcompletionconditions

