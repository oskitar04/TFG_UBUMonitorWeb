LoginTokenRequest:
  type: object
  required:
    - host
    - username
    - password
  properties:
    host:
      type: string
      format: uri
      description: Moodle site URL
      example: https://school.moodledemo.net
    username:
      type: string
      description: Moodle username
      example: teacher
    password:
      type: string
      format: password
      description: Moodle password
      example: moodle25

