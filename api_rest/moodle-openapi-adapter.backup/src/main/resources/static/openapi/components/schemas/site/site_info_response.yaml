SiteInfo:
  type: object
  properties:
    sitename:
      type: string
      description: Site name
    username:
      type: string
      description: Username
    firstname:
      type: string
      description: First name
    lastname:
      type: string
      description: Last name
    fullname:
      type: string
      description: User full name
    lang:
      type: string
      description: Current language
    userid:
      type: integer
      description: User id
    siteurl:
      type: string
      format: uri
      description: Site URL
    userpictureurl:
      type: string
      format: uri
      description: User profile picture URL (public)
    privateuserpictureurl:
      type: string
      format: uri
      description: User profile picture URL (private)
    functions:
      type: array
      description: Functions that are available
      items:
        title: Function
        type: object
        properties:
          name:
            type: string
            description: Function name
          version:
            type: string
            description: Version number of the component
        required:
          - name
          - version
    downloadfiles:
      type: boolean
      description: True if users are allowed to download files
      nullable: true
    uploadfiles:
      type: boolean
      description: True if users are allowed to upload files
      nullable: true
    release:
      type: string
      description: Moodle release number
      nullable: true
    version:
      type: string
      description: Moodle version number
      nullable: true
    versionname:
      type: string
      description: Moodle version number
      nullable: true
    mobilecssurl:
      type: string
      description: Mobile custom CSS theme
      nullable: true
    advancedfeatures:
      type: array
      description: Advanced features availability
      nullable: true
      items:
        title: Advanced Feature
        type: object
        properties:
          name:
            type: string
            description: Feature name
          value:
            type: integer
            description: Feature value. Usually 1 means enabled.
        required:
          - name
          - value
    usercanmanageownfiles:
      type: boolean
      description: True if the user can manage his own files
      nullable: true
    userquota:
      type: integer
      description: User quota (bytes). 0 means ignore quota
      nullable: true
    usermaxuploadfilesize:
      type: integer
      description: User max upload file size (bytes). -1 means ignore limit
      nullable: true
    userhomepage:
      type: integer
      description: "Default home page: 0 for site home, 1 for dashboard"
      nullable: true
    userhomepageurl:
      type: string
      description: URL of default home page when userhomepage is 4 (HOMEPAGE_URL)
      nullable: true
    userprivateaccesskey:
      type: string
      description: Private user access key for fetching files
      nullable: true
    siteid:
      type: integer
      description: Site course ID
      nullable: true
    sitecalendartype:
      type: string
      description: Calendar type set in the site
      nullable: true
    usercalendartype:
      type: string
      description: Calendar type used by the user
      nullable: true
    userissiteadmin:
      type: boolean
      description: Whether the user is a site admin
      nullable: true
    theme:
      type: string
      description: Current theme for the user
      nullable: true
    limitconcurrentlogins:
      type: integer
      description: Number of concurrent sessions allowed
      nullable: true
    usersessionscount:
      type: integer
      description: Number of active sessions for current user
      nullable: true
    policyagreed:
      type: boolean
      description: Whether user accepted all policies
      nullable: true

SiteConfig:
  type: object
  properties:
    wwwroot:
      type: string
      description: Site URL
    httpswwwroot:
      type: string
      description: Site https URL (if httpslogin is enabled)
    guestlogin:
      type: boolean
      description: Whether guest login is enabled
    rememberusername:
      type: string
      enum:
        - DISABLED
        - ENABLED
        - OPTIONAL
      description: NO, YES, OPTIONAL
    authloginviaemail:
      type: boolean
      description: Whether log in via email is enabled
    registerauth:
      type: string
      description: Authentication method for user registration
    forgottenpasswordurl:
      type: string
      description: Forgotten password URL
    authinstructions:
      type: string
      description: Authentication instructions
    authinstructionstext:
      type: string
      description: Authentication instructions parsed text
    authnoneenabled:
      type: boolean
      description: Whether auth none is enabled
    enablewebservices:
      type: boolean
      description: Whether Web Services are enabled
    enablemobilewebservice:
      type: boolean
      description: Whether the Mobile service is enabled
    maintenanceenabled:
      type: boolean
      description: Whether site maintenance is enabled
    maintenancemessage:
      type: string
      description: Maintenance message
    logourl:
      type: string
      description: Site logo URL
      nullable: true
    compactlogourl:
      type: string
      description: Site compact logo URL
      nullable: true
    typeoflogin:
      type: string
      enum:
        - APP
        - BROWSER
        - EMBEDDED
      description: The type of login
    launchurl:
      type: string
      format: uri
      description: SSO login launch URL
      nullable: true
    tool_mobile_disabledfeatures:
      type: string
      description: Disabled features in the app
      nullable: true
    identityproviders:
      type: array
      title: identityproviders
      description: Identity providers
      nullable: true
      items:
        title: identityprovider
        type: object
        properties:
          name:
            type: string
            description: The identity provider name
          iconurl:
            type: string
            format: uri
            description: The icon URL for the provider
          url:
            type: string
            format: uri
            description: The URL of the provider
        required:
          - name
          - iconurl
          - url
    country:
      type: string
      description: Default site country
      nullable: true
    agedigitalconsentverification:
      type: boolean
      description: Whether age digital consent verification is enabled
      nullable: true
    supportname:
      type: string
      description: Site support contact name (only if age verification is enabled)
      nullable: true
    supportemail:
      type: string
      description: Site support contact email (only if age verification is enabled)
      nullable: true
    supportpage:
      type: string
      description: Site support page link
      nullable: true
    supportavailability:
      type: boolean
      description: Determines who has access to contact site support
      nullable: true
    autolang:
      type: boolean
      description: Whether to detect default language from browser setting
      nullable: true
    langmenu:
      type: boolean
      description: Whether the language menu should be displayed
      nullable: true
    langlist:
      type: string
      description: Languages on language menu
      nullable: true
    locale:
      type: string
      description: Sitewide locale
      nullable: true
    tool_mobile_minimumversion:
      type: string
      description: Minimum required version to access
      nullable: true
    tool_mobile_iosappid:
      type: string
      description: iOS app's unique identifier
      nullable: true
    tool_mobile_androidappid:
      type: string
      description: Android app's unique identifier
      nullable: true
    tool_mobile_setuplink:
      type: string
      description: App download page
      nullable: true
    tool_mobile_qrcodetype:
      type: integer
      description: QR login configuration
      nullable: true
    warnings:
      type: array
      title: warnings
      description: List of warnings
      nullable: true
      items:
        title: warning
        type: object
        properties:
          item:
            type: string
            description: Item
            nullable: true
          itemid:
            type: integer
            description: Item id
            nullable: true
          warningcode:
            type: string
            description: The warning code can be used by the client app to implement specific behaviour
          message:
            type: string
            description: Untranslated english message to explain the warning
        required:
          - warningcode
          - message
    showloginform:
      type: boolean
      description: Display default login form

SiteInfoResponse:
  type: object
  properties:
    siteinfo:
      $ref: '#/SiteInfo'
    siteconfig:
      $ref: '#/SiteConfig'
