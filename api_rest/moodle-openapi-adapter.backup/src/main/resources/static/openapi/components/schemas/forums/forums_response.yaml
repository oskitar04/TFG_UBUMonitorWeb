ForumsResponse:
  type: object
  properties:
    forums:
      type: array
      items:
        type: object
        title: Forum
        properties:
          id:
            type: integer
            description: Forum id
          course:
            type: integer
            description: Course id
          type:
            type: string
            description: The forum type
          name:
            type: string
            description: Forum name
          intro:
            type: string
            description: The forum intro
          introtext:
            type: string
            description: The forum intro text parsed
          introformat:
            type: string
            description: intro format
            enum:
              - MOODLE
              - HTML
              - PLAIN
              - MARKDOWN
          introfiles:
            type: array
            title: Intro Files
            description: Files in the introduction text
            items:
              type: object
              title: Intro File
              properties:
                filename:
                  type: string
                  description: File name
                  nullable: true
                filepath:
                  type: string
                  description: File path
                  nullable: true
                filesize:
                  type: integer
                  description: File size
                  nullable: true
                fileurl:
                  type: string
                  format: uri
                  description: Downloadable file url
                  nullable: true
                timemodified:
                  type: string
                  format: date-time
                  description: Time modified
                  nullable: true
                mimetype:
                  type: string
                  description: File mime type
                  nullable: true
                isexternalfile:
                  type: boolean
                  description: Whether is an external file
                  nullable: true
                repositorytype:
                  type: string
                  description: The repository type for external files
                  nullable: true
                icon:
                  type: string
                  description: The relative path to the relevant file type icon based on the file's mime type
                  nullable: true
          lang:
            type: string
            description: Forced activity language
            nullable: true
          duedate:
            type: string
            format: date-time
            description: duedate for the user
            nullable: true
          cutoffdate:
            type: string
            format: date-time
            description: cutoffdate for the user
            nullable: true
          assessed:
            type: integer
            description: Aggregate type
          assesstimestart:
            type: string
            format: date-time
            description: Assess start time
          assesstimefinish:
            type: string
            format: date-time
            description: Assess finish time
          scale:
            type: integer
            description: Scale
          grade_forum:
            type: integer
            description: Whole forum grade
          grade_forum_notify:
            type: boolean
            description: Whether to send notifications to students upon grading by default
          maxbytes:
            type: integer
            description: Maximum attachment size
          maxattachments:
            type: integer
            description: Maximum number of attachments
          forcesubscribe:
            type: boolean
            description: Force users to subscribe
          trackingtype:
            type: integer
            description: Subscription mode
          rsstype:
            type: integer
            description: RSS feed for this activity
          rssarticles:
            type: integer
            description: Number of RSS recent articles
          timemodified:
            type: string
            format: date-time
            description: Time modified
          warnafter:
            type: integer
            description: Post threshold for warning
          blockafter:
            type: integer
            description: Post threshold for blocking
          blockperiod:
            type: integer
            description: Time period for blocking
          completiondiscussions:
            type: integer
            description: Student must create discussions
          completionreplies:
            type: integer
            description: Student must post replies
          completionposts:
            type: integer
            description: Student must post discussions or replies
          cmid:
            type: integer
            description: Course module id
          numdiscussions:
            type: integer
            description: Number of discussions in the forum
            nullable: true
          cancreatediscussions:
            type: boolean
            description: If the user can create discussions
            nullable: true
          lockdiscussionafter:
            type: integer
            description: After what period a discussion is locked
            nullable: true
          istracked:
            type: boolean
            description: If the user is tracking the forum
            nullable: true
          unreadpostscount:
            type: integer
            description: The number of unread posts for tracked forums
            nullable: true
          discussions:
            nullable: true
            type: array
            items:
              $ref: '../forums/discussions_response.yaml#/Discussion'
        required:
          - id
          - course
          - type
          - name
          - intro
          - introformat
          - assessed
          - assesstimestart
          - assesstimefinish
          - scale
          - grade_forum
          - grade_forum_notify
          - maxbytes
          - maxattachments
          - forcesubscribe
          - trackingtype
          - rsstype
          - rssarticles
          - timemodified
          - warnafter
          - blockafter
          - blockperiod
          - completiondiscussions
          - completionreplies
          - completionposts
          - cmid
