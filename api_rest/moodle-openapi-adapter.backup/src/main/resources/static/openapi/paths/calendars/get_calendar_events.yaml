get:
  tags:
    - Calendars
  summary: Get calendars events
  description: Get calendars events
  operationId: getCalendarEvents
  parameters:
    - name: eventids
      in: query
      description: Filter events by event IDs. If not provided, events from all event IDs will be returned.
      schema:
        type: array
        items:
          type: integer
      style: form
      explode: false
    - name: courseids
      in: query
      description: Filter events by course IDs. If not provided, events from all courses will be returned.
      schema:
        type: array
        items:
          type: integer
      style: form
      explode: false
    - name: groupids
      in: query
      description: Filter events by group IDs. If not provided, events from all groups will be returned.
      schema:
        type: array
        items:
          type: integer
      style: form
      explode: false
    - name: categoryids
      in: query
      description: Filter events by category IDs. If not provided, events from all categories will be returned.
      schema:
        type: array
        items:
          type: integer
      style: form
      explode: false
    - name: userevents
      in: query
      description: Filter events by user events. If not provided, both user and non-user events will be returned.
      schema:
        type: boolean
    - name: siteevents
      in: query
      description: Filter events by site events. If not provided, both site and non-site events will be returned.
      schema:
        type: boolean
    - name: timestart
      in: query
      description: Filter events that start after this time (ISO 8601 datetime). If not provided, events from all time periods will be returned.
      schema:
        type: string
        format: date-time
    - name: timeend
      in: query
      description: Filter events that end before this time (ISO 8601 datetime). If not provided, events from all time periods will be returned.
      schema:
        type: string
        format: date-time
    - name: ignorehidden
      in: query
      description: Whether to ignore hidden events. If not provided, both hidden and non-hidden events will be returned.
      schema:
        type: boolean
  responses:
    '200':
      description: List of calendar events
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/calendars/get_calendar_events.yaml#/CalendarEventsResponse'
    '400':
      $ref: '../../components/responses/bad_request_400.yaml'
    '401':
      $ref: '../../components/responses/unauthorized_401.yaml'
