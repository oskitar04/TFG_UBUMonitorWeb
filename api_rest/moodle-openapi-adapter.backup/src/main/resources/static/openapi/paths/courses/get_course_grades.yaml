get:
  tags:
    - Courses
  summary: List grades by courseid
  description: Get grades filtered by course ID and optionally userid and/or groupid
  operationId: getCourseGrades
  parameters:
    - name: courseid
      in: path
      description: Filter courses by user ID
      required: true
      schema:
        type: integer
    - name: userid
      in: query
      schema:
        type: integer
      description: Return grades only for this user
    - name: groupid
      in: query
      description: Get users from this group only
      schema:
        type: integer
  responses:
    '200':
      description: List of grades
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/courses/course_grades_response.yaml#/CourseGradesResponse'
    '400':
      $ref: '../../components/responses/bad_request_400.yaml'
    '401':
      $ref: '../../components/responses/unauthorized_401.yaml'
