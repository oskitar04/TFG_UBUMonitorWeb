get:
  summary: Retrieve activities completion
  description: Return the activities completion status for a users in a course.
  operationId: getCourseActivitiesCompletion
  tags:
    - Courses
  parameters:
    - name: courseid
      in: path
      required: true
      schema:
        type: integer
      description: ID of the course
    - name: userids
      in: query
      required: true
      explode: false
      schema:
        type: array
        items:
          type: integer
        minItems: 1
        description: List of user IDs to retrieve the activities completion status for. This parameter is required
  responses:
    '200':
      description: List of users
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/courses/course_activities_completion_response.yaml#/CourseActivitiesCompletionResponse'
    '400':
      $ref: '../../components/responses/bad_request_400.yaml'
    '401':
      $ref: '../../components/responses/unauthorized_401.yaml'
