get:
  tags:
    - Forums
  summary: Get posts by discussion ids
  operationId: getPostsByDiscussionId
  description: Returns a list of posts in a provided discussion, optionally sorted and paginated.
  parameters:
    - name: discussionids
      in: query
      style: form
      required: true
      explode: false
      schema:
        type: array
        items:
          type: integer
        minItems: 1
      description: IDs of the discussion
    - name: sortby
      in: query
      schema:
        type: string
        enum:
          - ID
          - CREATED
          - MODIFIED
      description: Field to sort the posts by
    - name: sortdirection
      in: query
      schema:
        type: string
        enum:
          - ASC
          - DESC
      description: Sort direction of the posts
    - name: includeinlineattachments
      in: query
      schema:
        type: boolean
        description: Whether inline attachments should be included or not
  responses:
    '200':
      description: Get discussions by forum id
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/forums/posts_response.yaml#/PostsResponse'
    '400':
      $ref: '../../components/responses/bad_request_400.yaml'
    '401':
      $ref: '../../components/responses/unauthorized_401.yaml'
