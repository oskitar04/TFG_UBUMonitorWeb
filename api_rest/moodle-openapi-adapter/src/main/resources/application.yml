spring:
  profiles:
    default: prod
  config:
    import: classpath:application-moodlerules.yml
  web:
    resources:
      add-mappings: false
  devtools:
    restart:
      enabled: false

  main:
    allow-bean-definition-overriding: true
springdoc:
  api-docs:
    enabled: false

# Moodle Client Configuration - Timeouts and Resilience
moodle:
  client:
    # Connection timeout in milliseconds (5 seconds)
    connection-timeout-ms: 5000
    # Read timeout in milliseconds (120 seconds)
    read-timeout-ms: 120000
    # Write timeout in milliseconds (30 seconds)
    write-timeout-ms: 30000
    # Maximum connections in pool
    max-connections: 100
    # Max idle time in seconds
    max-idle-time-seconds: 30
    # Pending acquire timeout in seconds
    pending-acquire-timeout-seconds: 60
    # Maximum pending acquire count
    pending-acquire-max-count: 1000
    # Retry configuration for transient failures
    retry-attempts: 1
    retry-initial-delay-ms: 100
    retry-max-delay-seconds: 5
